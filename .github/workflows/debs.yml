name: debs
on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'tool da compilare (virgole, vuoto = tutti)'
        required: false
        default: ''
  push:
    paths: ['crossbuild/**']

permissions:
  contents: write

jobs:
  build-debs:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install flex bison autoconf automake libtool
      - name: Build debs (cross iphoneos-arm64)
        run: |
          cd crossbuild
          chmod +x *.sh deps/*.sh tools/*.sh
          if [ -n "${{ github.event.inputs.tools }}" ]; then
            IFS=',' read -ra T <<< "${{ github.event.inputs.tools }}"
          else
            T=$(for f in tools/*.sh; do basename "$f" .sh; done)
          fi
          set -o pipefail
          FAILED=""
          for t in $T; do
            if ! ./build.sh "$t" 2>&1 | tee "$t.log"; then
              echo "=== SKIP $t: primo errore ==="
              grep -n -B10 -m1 "error:\|Error 1\|No such file\|not found\|undefined refe" "$t.log" || true
              echo "=== SKIP $t: tail ==="
              tail -40 "$t.log" || true
              rm -rf stage
              FAILED="$FAILED $t"
            fi
          done
          echo "FAILED_TOOLS=$FAILED" | tee failed.txt
          ls -la deb/ || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: redhatsec-debs
          path: crossbuild/deb/*.deb
          if-no-files-found: error
      - name: Publish to release tag "debs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd crossbuild
          gh release create debs --title "Tool debs iphoneos-arm64" \
            --notes "Cross-compiled security tools for rootless iOS. Install via app (debURL)." 2>/dev/null || true
          gh release upload debs deb/*.deb --clobber
