name: Build RedHatSec (unsigned, TrollStore)

on:
  push:
    paths: ["RedHatSec/**", ".github/workflows/build.yml"]
  workflow_dispatch:

concurrency:
  group: redhatsec-build
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: cd RedHatSec && xcodegen

      - name: Build unsigned (arm64, iphoneos)
        run: |
          cd RedHatSec
          xcodebuild -project RedHatSec.xcodeproj -scheme RedHatSec \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED="NO" CODE_SIGNING_ALLOWED="NO" \
            ARCHS=arm64 build | tail -30

      - name: Fake-sign with entitlements
        continue-on-error: true
        run: |
          set -x
          APP=$(find RedHatSec/build -type d -name '*.app' | head -1)
          echo "APP=[$APP]"
          ls -la "$APP" || true
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" 2>&1)
          echo "EXEC=[$EXEC]"
          if [ -f "$APP/$EXEC" ]; then
            ldid -SRedHatSec.entitlements "$APP/$EXEC" && echo "SIGNED OK"
          else
            echo "::error::executable non trovato in $APP"
            file "$APP"/* || true
            exit 1
          fi

      - name: Package .app
        run: |
          APP=$(find RedHatSec/build -maxdepth 5 -type d -name '*.app' | head -1)
          cd "$(dirname "$APP")"
          zip -qr RedHatSec.tipa "$(basename "$APP")"

      - uses: actions/upload-artifact@v4
        with:
          name: RedHatSec-${{ matrix.os }}
          path: RedHatSec/build/Build/Products/Release-iphoneos/RedHatSec.tipa
