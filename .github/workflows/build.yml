name: Build RedHatSec (unsigned, TrollStore)

on:
  push:
    paths: ["RedHatSec/**", ".github/workflows/build.yml"]
  workflow_dispatch:

concurrency:
  group: redhatsec-build
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: cd RedHatSec && xcodegen

      - name: Build unsigned (arm64, iphoneos)
        run: |
          cd RedHatSec
          if xcodebuild -project RedHatSec.xcodeproj -scheme RedHatSec \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED="NO" CODE_SIGNING_ALLOWED="NO" \
            ARCHS=arm64 build > build.log 2>&1; then
            echo "BUILD OK"
            grep -E "warning:" build.log | tail -10 || true
          else
            echo "===== BUILD FAILED — tutti gli errori ====="
            grep -E "error:" build.log | head -60
            tail -6 build.log
            exit 1
          fi

      - name: Build RHSHelper
        run: |
          cd RedHatSec
          if xcodebuild -project RedHatSec.xcodeproj -target RHSHelper \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED="NO" CODE_SIGNING_ALLOWED="NO" \
            ARCHS=arm64 build > helper.log 2>&1; then
            echo "HELPER OK"
            find build -type f -name 'RHSHelper'
          else
            echo "===== HELPER BUILD FAILED ====="
            grep -E "error:" helper.log | head -40
            exit 1
          fi

      - name: Verify built binary
        run: |
          APP=$(find RedHatSec/build -type d -name '*.app' | head -1)
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          test -f "$APP/$EXEC" && echo "binary OK: $APP/$EXEC"

      - name: Fake-sign with entitlements
        continue-on-error: true
        run: |
          set -x
          APP=$(find RedHatSec/build -type d -name '*.app' | head -1)
          echo "APP=[$APP]"
          ls -la "$APP" || true
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" 2>&1)
          echo "EXEC=[$EXEC]"
          if [ -f "$APP/$EXEC" ]; then
            ldid -SRedHatSec/RedHatSec.entitlements "$APP/$EXEC" && echo "SIGNED OK"
          else
            echo "::error::executable non trovato in $APP"
            file "$APP"/* || true
            exit 1
          fi

      - name: Embed RHSHelper
        run: |
          APP=$(find RedHatSec/build -type d -name '*.app' | head -1)
          HELPER=$(find RedHatSec/build -type f -name RHSHelper | head -1)
          if [ -z "$HELPER" ]; then echo "::error::RHSHelper non trovato in build products"; find RedHatSec/build -name '*RHSHelper*' || true; exit 1; fi
          ldid -S "$HELPER"
          cp "$HELPER" "$APP/RHSHelper"
          echo "helper embedded: $APP/RHSHelper"

      - name: Package .app
        run: |
          APP=$(find RedHatSec/build -maxdepth 5 -type d -name '*.app' | head -1)
          cd "$(dirname "$APP")"
          rm -rf Payload
          mkdir Payload
          cp -R "$(basename "$APP")" Payload/
          zip -qr RedHatSec.tipa Payload
          ls -la RedHatSec.tipa

      - uses: actions/upload-artifact@v4
        with:
          name: RedHatSec-${{ matrix.os }}
          path: RedHatSec/build/Build/Products/Release-iphoneos/RedHatSec.tipa
